# 把仓库里已构建好的 docs/ 同步到腾讯云 COS（静态网站托管）
#
# 为什么直接同步 docs/：仓库里已经提交了构建产物，CI 不需要再装依赖、跑构建，
# 一次部署通常十几秒。如果你想改成「CI 自己构建」，把下面注释里的 build 步骤打开，
# 并把上传路径改成 dist/ 或 docs/ 即可（记得同步改 vite.config.js 的 outDir）。
#
# 需要先在仓库 Settings → Secrets and variables → Actions 里配置这 4 个 Secret：
#   TENCENT_SECRET_ID    腾讯云 API 密钥 SecretId（建议用子账号 + 只授权该存储桶）
#   TENCENT_SECRET_KEY   腾讯云 API 密钥 SecretKey
#   COS_BUCKET           存储桶名称，格式「桶名-APPID」，例如 myportfolio-1250000000
#   COS_REGION           存储桶地域，例如 ap-guangzhou / ap-shanghai / ap-beijing
name: Deploy to Tencent COS

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-cos.yml'
  workflow_dispatch:

concurrency:
  group: cos-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # 需要让 CI 自己构建时，打开这两步（并把下面的上传路径改成 dist/ 或 docs/）
      # - name: 安装 Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '22'
      #     cache: npm
      # - name: 安装依赖并构建
      #   run: npm ci && npm run build

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 coscmd
        run: pip install coscmd

      - name: 配置 coscmd
        env:
          SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          BUCKET: ${{ secrets.COS_BUCKET }}
          REGION: ${{ secrets.COS_REGION }}
        run: coscmd config -a "$SECRET_ID" -s "$SECRET_KEY" -b "$BUCKET" -r "$REGION"

      - name: 同步 docs/ 到存储桶根目录
        run: |
          # -r 递归上传 / -s 跳过内容相同的文件 / --delete 删除远端多余文件（真正的「同步」）
          # 万一当前 coscmd 版本不接受 --delete，自动退回普通递归上传
          coscmd upload -rs --delete ./docs/ / || coscmd upload -r ./docs/ /
